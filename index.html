<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ars Obscura: sistema de estudos</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#050506;--cd:#111113;--tx:#e6dfd0;--mu:#8f8b84;--bd:#2a2a2d;--au:#d8ccb4;--au2:#6f6a5e;--cr:#a33a24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.45 "Cormorant Garamond",Georgia,serif}
main{max-width:720px;margin:0 auto;padding:24px 14px 48px}
header{text-align:center;margin-bottom:18px}
h1{font:500 26px "Cinzel",Georgia,serif;letter-spacing:.22em;color:var(--au);margin:6px 0 0}
.sub{font-style:italic;color:var(--mu);margin:2px 0 0}
.ov{border:1px solid var(--au2);border-radius:4px;padding:12px 14px;margin-bottom:8px}
.ov div{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--mu)}
.ov #op{color:var(--au);font-weight:600}
.bar{display:block;flex-basis:100%;height:3px;background:var(--bd)}
.bar b{display:block;height:100%;width:0;background:var(--au)}
h2{display:flex;align-items:center;gap:10px;font:500 13px "Cinzel",Georgia,serif;letter-spacing:.18em;text-transform:uppercase;color:var(--au2);margin:26px 0 10px}
h2::before,h2::after{content:"";flex:1;height:1px;background:var(--bd)}
details{background:var(--cd);border:1px solid var(--bd);border-radius:4px;margin-bottom:8px}
details[open]{border-color:var(--au2)}
details.main{border-left:3px solid var(--cr)}
summary{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:14px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.n{font:500 13px "Cinzel",Georgia,serif;color:var(--au);border:1px solid var(--au2);transform:rotate(0);padding:2px 7px;min-width:20px;text-align:center}
.t{flex:1;font-weight:600;font-size:20px}
.p{font-size:15px;color:var(--mu)}
.done .p,.done .t{color:var(--au)}
.sg{font-size:13px;font-style:italic;color:var(--mu);margin-left:6px}
h3{font:500 12px "Cinzel",Georgia,serif;letter-spacing:.12em;color:var(--mu);margin:10px 14px 0}
.it{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--bd)}
input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;margin:0;display:grid;place-content:center;border:1px solid var(--au2);border-radius:3px;background:transparent}
input:checked{background:var(--au);border-color:var(--au)}
input:checked::after{content:"✦";color:#050506;font-size:13px;line-height:1}
.it input:checked+span{color:var(--mu);text-decoration:line-through}
.nt{font-size:15px;font-style:italic;color:var(--mu);margin:6px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:6px;padding:6px 14px 14px}
.sp{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:3px;padding:8px;font-size:16px}
.sp:has(input:checked){border-color:var(--au);color:var(--au)}
.ft{color:var(--mu);font-size:14px;font-style:italic;text-align:center;margin-top:22px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main{position:relative;z-index:1}
.em{display:block;margin:0 auto 14px;width:min(240px,62vw);height:auto;border:1px solid var(--au2);border-radius:2px}
.mx{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--mu);line-height:1.9;margin:10px 0 0}
</style></head><body><canvas id="sky" aria-hidden="true"></canvas><main>
